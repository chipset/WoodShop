name: Release

# Pushing a tag such as v0.16.0 tests the code, builds the app and attaches the zip to a GitHub release.
# Running the workflow by hand (Actions tab -> Release -> Run workflow) does a dry run: it builds
# and uploads the zip as a downloadable workflow artifact, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"
          fi
      - name: Test
        run: swift test
      - name: Build the app
        run: BUILD="${GITHUB_RUN_NUMBER}" ./build_app.sh
      - name: Package
        run: |
          mkdir stage
          cp -R WoodShop.app stage/
          cp LICENSE stage/LICENSE.txt
          (cd stage && ditto -c -k . "../WoodShop-${VERSION}-macOS.zip")
      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoodShop-${{ env.VERSION }}-macOS
          path: WoodShop-${{ env.VERSION }}-macOS.zip
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="WoodShop-${VERSION}-macOS.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "WoodShop ${VERSION}" --generate-notes
          fi
